[package]
name = "cam"
version = "0.3.0"
edition = "2021"
description = "Stills, clips and a live pane from any camera this machine can see."
license = "MIT"
repository = "https://github.com/pointman-ai/pointman-cam"
publish = false

[dependencies]
anyhow = "1"
libc = "0.2"
pointman-extension = { git = "https://github.com/pointman-ai/pointman-extension", rev = "b4b2f874595fac71d220bb920e96c6390678c5a2" }
regex = "1"
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = true
